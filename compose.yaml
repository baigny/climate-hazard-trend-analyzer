services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - climate-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-${PORT:-8000}}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      DB_BACKEND: mongodb
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-climatrace}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  climate-data:
