services:
  - type: web
    name: climatrace
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: '10000'
      - key: DB_BACKEND
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: climatrace
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
